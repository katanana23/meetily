[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Dev: зависимости с оптимизацией, само приложение без неё (пересборка после правок
# остаётся быстрой). Без этого обработка микрофона в колбэке реального времени
# (rubato, ebur128) в dev в 13–20 раз тяжелее и с гарнитурой не успевает за 10 мс.
# whisper.cpp и ONNX Runtime оптимизированы и без этого. Профили читаются только
# из корневого Cargo.toml рабочей области.
[profile.dev.package."*"]
opt-level = 3
