<title>Свечение голоса</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: одна сцена как в каталоге Umbra - полотно с телефоном слева, панель контролов справа, на телефоне панель под сценой */
:root {
  --window: #ECEEEB;
  --tile: #FFFFFF;
  --nested: #F4F4F2;
  --text: #111111;
  --text-muted: #4D4D4D;
  --primary: #E4FB77;
  --primary-edge: #576E00;
  --on-primary: #111111;
  --frame-bg: #F7F7F5;
  --frame-edge: rgba(17,17,17,0.08);
  --glass: rgba(255,255,255,0.55);
  --glass-edge: rgba(17,17,17,0.08);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-tile: 24px;
  --radius-nested: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --window: #1C1C1C; --tile: #0A0A0A; --nested: #1A1A1A; --text: #FFFFFF; --text-muted: #B3B3B3;
    --primary-edge: #E4FB77; --frame-bg: #141414; --frame-edge: rgba(255,255,255,0.08);
    --glass: rgba(255,255,255,0.08); --glass-edge: rgba(255,255,255,0.12); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --window: #1C1C1C; --tile: #0A0A0A; --nested: #1A1A1A; --text: #FFFFFF; --text-muted: #B3B3B3;
  --primary-edge: #E4FB77; --frame-bg: #141414; --frame-edge: rgba(255,255,255,0.08);
  --glass: rgba(255,255,255,0.08); --glass-edge: rgba(255,255,255,0.12); color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--window); color: var(--text); font-family: var(--font); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
header h1 { font-size: 28px; line-height: 34px; font-weight: 700; margin: 0; text-wrap: balance; }
header h1 code { font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--text-muted); margin-left: 8px; }
header p { margin: 4px 0 0; color: var(--text-muted); text-wrap: pretty; }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 8px; }
.canvas-tile {
  background: var(--tile); border-radius: var(--radius-tile); min-height: 560px;
  display: grid; place-items: center; padding: 20px; min-width: 0;
}
.panel { background: var(--tile); border-radius: var(--radius-tile); padding: 20px; display: grid; gap: 20px; align-content: start; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; } .canvas-tile { min-height: 520px; } }

/* Телефон - поле ввода голоса */
.frame {
  position: relative; width: 340px; max-width: 100%; height: 500px;
  background: var(--frame-bg); border-radius: 44px; overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--frame-edge);
  isolation: isolate;
}
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.transcript {
  position: absolute; left: 28px; right: 28px; bottom: 132px; z-index: 1;
  text-align: center; font-size: 19px; line-height: 26px; font-weight: 500; text-wrap: balance;
  color: var(--text); min-height: 52px;
}
.transcript .muted { color: var(--text-muted); }
.transcript .w { opacity: 0; filter: blur(4px); transition: opacity .35s ease, filter .35s ease; }
.transcript .w.on { opacity: 1; filter: blur(0); }
.status { position: absolute; top: 26px; left: 0; right: 0; text-align: center; z-index: 1; font-size: 13px; color: var(--text-muted); }
.bar { position: absolute; left: 20px; right: 20px; bottom: 28px; z-index: 1; display: flex; align-items: center; gap: 8px; }
.pill, .round {
  height: 44px; border-radius: 999px; background: var(--glass); color: var(--text);
  box-shadow: inset 0 0 0 1px var(--glass-edge);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  display: inline-flex; align-items: center; justify-content: center; border: 0; font: 500 14px var(--font);
}
.pill { padding: 0 16px; gap: 6px; }
.round { width: 44px; }
.spacer { flex: 1; }
.pill svg, .round svg { width: 20px; height: 20px; fill: currentColor; }

/* Панель */
.group { display: grid; gap: 8px; }
.group > span { font-size: 13px; color: var(--text-muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  height: 36px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--nested); color: var(--text); font: 500 14px var(--font);
}
.chip[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--primary-edge); }
.chip:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--primary-edge); outline-offset: 2px; }
.range { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.range output { font-family: var(--mono); font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
input[type=range] { width: 100%; accent-color: var(--primary-edge); }
.note { font-size: 13px; line-height: 18px; color: var(--text-muted); text-wrap: pretty; margin: 0; }
</style>

<div class="page">
  <header>
    <h1>Свечение голоса<code>VoiceGlow</code></h1>
    <p>Свечение поднимается от нижнего края вместе с голосом и ходит из стороны в сторону, пока ИИ думает</p>
  </header>

  <section class="stage" aria-label="Сцена">
    <div class="canvas-tile">
      <div class="frame" id="frame">
        <canvas id="glow" aria-hidden="true"></canvas>
        <div class="status" id="status">Слушаю</div>
        <div class="transcript" id="transcript" aria-live="polite"></div>
        <div class="bar">
          <button class="pill" type="button" tabindex="-1">Агент
            <svg viewBox="0 0 256 256"><path d="M213.66 101.66l-80 80a8 8 0 0 1-11.32 0l-80-80A8 8 0 0 1 48 88h160a8 8 0 0 1 5.66 13.66Z"/></svg>
          </button>
          <span class="spacer"></span>
          <button class="round" type="button" aria-label="Микрофон" tabindex="-1">
            <svg viewBox="0 0 256 256"><path d="M80 128V64a48 48 0 0 1 96 0v64a48 48 0 0 1-96 0Zm128 0a8 8 0 0 0-16 0 64 64 0 0 1-128 0 8 8 0 0 0-16 0 80.11 80.11 0 0 0 72 79.6V232a8 8 0 0 0 16 0v-24.4a80.11 80.11 0 0 0 72-79.6Z"/></svg>
          </button>
          <button class="round" type="button" aria-label="Закрыть" tabindex="-1">
            <svg viewBox="0 0 256 256"><path d="M208.49 191.51a12 12 0 0 1-17 17L128 145l-63.51 63.49a12 12 0 0 1-17-17L111 128 47.51 64.49a12 12 0 0 1 17-17L128 111l63.51-63.52a12 12 0 0 1 17 17L145 128Z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="group" role="group" aria-labelledby="g-mode">
        <span id="g-mode">Состояние</span>
        <div class="chips" data-key="mode">
          <button class="chip" type="button" id="m-auto" data-v="auto" aria-pressed="true">Сценарий</button>
          <button class="chip" type="button" id="m-listen" data-v="listen" aria-pressed="false">Голос</button>
          <button class="chip" type="button" id="m-think" data-v="think" aria-pressed="false">Думает</button>
          <button class="chip" type="button" id="m-idle" data-v="idle" aria-pressed="false">Тишина</button>
        </div>
      </div>
      <div class="group" role="group" aria-labelledby="g-pal">
        <span id="g-pal">Палитра</span>
        <div class="chips" data-key="palette">
          <button class="chip" type="button" id="p-color" data-v="0" aria-pressed="true">Цветная</button>
          <button class="chip" type="button" id="p-ocean" data-v="1" aria-pressed="false">Океан</button>
        </div>
      </div>
      <div class="group">
        <span><label for="sens">Чувствительность</label></span>
        <div class="range"><input id="sens" type="range" min="0.5" max="2" step="0.1" value="1.2"><output for="sens" id="sens-o">1.2×</output></div>
      </div>
      <div class="group">
        <span><label for="reach">Высота</label></span>
        <div class="range"><input id="reach" type="range" min="0.5" max="1.6" step="0.05" value="1"><output for="reach" id="reach-o">1.0×</output></div>
      </div>
      <p class="note">Уровень голоса здесь демонстрационный. В продукте компонент получает уровень снаружи функцией level() от 0 до 1</p>
    </div>
  </section>
</div>

<script>
(() => {
  const frame = document.getElementById('frame');
  const canvas = document.getElementById('glow');
  const statusEl = document.getElementById('status');
  const tr = document.getElementById('transcript');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  const state = { mode: 'auto', palette: 0, sens: 1.2, reach: 1 };

  // ---------- WebGL ----------
  const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
  const VS = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
  const FS = `
precision highp float;
uniform vec2 uRes; uniform float uTime, uLevel, uThink, uSweep, uRadius, uPalette, uReach, uDark;

float sdRoundBox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.)) + min(max(q.x,q.y),0.) - r; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3. - 2.*f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y); }
float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 4; i++) { v += a * vnoise(p); p *= 2.02; a *= .5; } return v; }
// Палитра по кругу: розовый, персиковый, барвинок, сиреневый (океан - бирюза и синий)
vec3 apal(float t){
  t = fract(t);
  vec3 c0 = vec3(1., .40, .50), c1 = vec3(1., .72, .45), c2 = vec3(.52, .60, 1.), c3 = vec3(.76, .50, .98);
  if (uPalette > .5) { c0 = vec3(.28, .86, .96); c1 = vec3(.35, .56, 1.); c2 = vec3(.56, .46, 1.); c3 = vec3(.26, .95, .80); }
  float s = t * 4.;
  return s < 1. ? mix(c0, c1, s) : s < 2. ? mix(c1, c2, s - 1.) : s < 3. ? mix(c2, c3, s - 2.) : mix(c3, c0, s - 3.);
}

void main(){
  vec2 px = gl_FragCoord.xy;
  vec2 res = uRes;
  float W = res.x, H = res.y;
  vec2 c = px - res*.5;
  float sd = sdRoundBox(c, res*.5, uRadius);
  float inside = 1. - smoothstep(-1., 1., sd);
  if (inside <= 0.) { gl_FragColor = vec4(0.); return; }
  float x = px.x / W;
  float y = px.y;             // от низа, в пикселях
  float t = uTime;
  float L = uLevel;

  // Цвет течёт вдоль края, без полос и швов
  float flow = fbm(vec2(x*1.6 - t*.12, t*.07));
  vec3 hue = apal(x*.85 + flow*.9 + t*.045);

  // Высота свечения: плавная волна вдоль края, растёт с голосом
  float wob = fbm(vec2(x*2.2 + t*.32, t*.22));
  float h = H * (.035 + uReach * L * (.10 + .28*wob));
  // Думает: мягкий холм ходит из стороны в сторону
  float lump = exp(-pow((x - uSweep)/.24, 2.));
  h = mix(h, H * (.045 + .26*uReach*lump), uThink);

  float g = exp(-pow(max(y, 0.) / max(h, 1.), 1.25));
  vec3 col = hue * g * (.55 + .9*L + .45*uThink);

  // Светлая кромка по нижнему краю и скруглениям
  float rim = exp(sd / 3.) * smoothstep(H*.25, 0., y);
  col += mix(hue, vec3(1.), .35) * rim * (.5 + .9*L + .4*uThink);

  // Белая сердцевина там, где свечение гуще всего
  col += vec3(1.) * pow(g, 3.) * (.10 + .32*L + .15*uThink);

  // Верх кадра всегда чистый: текст над свечением читается
  col *= smoothstep(H*.72, H*.18, y);

  // Тонировка: мягкий предел, на светлой теме меньше белого
  col = 1. - exp(-col * 1.15);
  col *= mix(.9, 1., uDark);
  float a = clamp(max(col.r, max(col.g, col.b)) * mix(1.1, 1., uDark), 0., 1.) * inside;
  gl_FragColor = vec4(col * inside, a);
}`;

  function shader(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  let U = null;
  if (gl) {
    const pr = gl.createProgram();
    gl.attachShader(pr, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, shader(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(pr); gl.useProgram(pr);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    U = {}; ['uRes','uTime','uLevel','uThink','uSweep','uRadius','uPalette','uReach','uDark'].forEach(n => U[n] = gl.getUniformLocation(pr, n));
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  }

  let dpr = 1;
  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = frame.getBoundingClientRect();
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
  }
  new ResizeObserver(resize).observe(frame); resize();

  const isDark = () => {
    const a = document.documentElement.getAttribute('data-theme');
    if (a) return a === 'dark';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  };

  // ---------- Уровень голоса (демо) ----------
  // Слоги: короткие всплески 120-260 мс, между словами паузы, между фразами длинная пауза
  let syl = { until: 0, peak: 0, next: 0 };
  function demoLevel(now){
    if (now > syl.until && now > syl.next) {
      const pause = Math.random() < .18 ? 260 + Math.random()*320 : 40 + Math.random()*90;
      const len = 120 + Math.random()*140;
      syl = { start: now + pause, until: now + pause + len, peak: .45 + Math.random()*.55, next: now + pause + len };
    }
    if (now < syl.start || now > syl.until) return 0.04 + Math.random()*.03;
    const k = (now - syl.start) / (syl.until - syl.start);
    return syl.peak * Math.sin(Math.PI * k) * (.85 + Math.random()*.3);
  }

  // ---------- Сценарий: слушает -> думает -> ответ -> пауза ----------
  const QUESTION = 'Поставь таймер на десять минут и напомни полить цветы';
  const ANSWER = 'Готово. Таймер на 10 минут, потом напомню про цветы';
  const words = QUESTION.split(' ');
  let scene = { phase: 'listen', t0: performance.now(), shown: 0 };
  function renderWords(list, n, cls){
    tr.innerHTML = list.slice(0, n).map((w, i) => `<span class="w${i < n - 1 ? ' on' : ''}${cls ? ' ' + cls : ''}">${w}</span>`).join(' ');
    const lastW = tr.lastElementChild; if (lastW) requestAnimationFrame(() => lastW.classList.add('on'));
  }
  function setPhase(p){
    scene = { phase: p, t0: performance.now(), shown: 0 };
    statusEl.textContent = p === 'listen' ? 'Слушаю' : p === 'think' ? 'Думаю' : p === 'answer' ? 'Ответ' : '';
    if (p === 'listen') renderWords(words, 0);
    if (p === 'answer') { tr.innerHTML = `<span class="w on">${ANSWER}</span>`; }
    if (p === 'idle') { /* оставляем последний текст */ }
  }
  setPhase('listen');

  function sceneTick(now){
    const dt = now - scene.t0;
    if (scene.phase === 'listen') {
      const n = Math.min(words.length, Math.floor(dt / 330));
      if (n !== scene.shown) { scene.shown = n; renderWords(words, n); }
      if (dt > words.length * 330 + 600) setPhase('think');
    } else if (scene.phase === 'think') {
      if (dt > 2800) setPhase('answer');
    } else if (scene.phase === 'answer') {
      if (dt > 2600) setPhase('idle');
    } else if (scene.phase === 'idle') {
      if (dt > 1400) setPhase('listen');
    }
  }

  // ---------- Цикл ----------
  let level = 0, think = 0, sweepPhase = 0, last = performance.now(), raf = 0;
  const t0 = performance.now();
  function frameLoop(now){
    const dt = Math.min(64, now - last); last = now;
    const mode = state.mode === 'auto' ? scene.phase : state.mode;
    if (state.mode === 'auto') sceneTick(now);

    let target = 0;
    if (mode === 'listen') target = Math.min(1, demoLevel(now) * state.sens);
    else if (mode === 'think') target = .28;
    else if (mode === 'answer') target = .12;
    else target = .02;
    // Быстрая атака, медленный спад
    const k = target > level ? 1 - Math.exp(-dt / 45) : 1 - Math.exp(-dt / 260);
    level += (target - level) * k;
    const thinkTarget = mode === 'think' ? 1 : 0;
    think += (thinkTarget - think) * (1 - Math.exp(-dt / 380));
    sweepPhase += dt * .0016;
    const sweep = .5 + .32 * Math.sin(sweepPhase);

    draw((now - t0) / 1000, level, think, sweep);
    raf = requestAnimationFrame(frameLoop);
  }

  function draw(time, lv, th, sweep){
    if (!gl) return;
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, time);
    gl.uniform1f(U.uLevel, lv);
    gl.uniform1f(U.uThink, th);
    gl.uniform1f(U.uSweep, sweep);
    gl.uniform1f(U.uRadius, 44 * dpr);
    gl.uniform1f(U.uPalette, state.palette);
    gl.uniform1f(U.uReach, state.reach);
    gl.uniform1f(U.uDark, isDark() ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function start(){
    cancelAnimationFrame(raf);
    if (reduce.matches) {
      // Без движения: статичная полоса, текст сразу целиком
      if (state.mode === 'auto' || state.mode === 'listen') renderWords(words, words.length);
      statusEl.textContent = 'Слушаю';
      draw(0, state.mode === 'idle' ? .02 : .3, state.mode === 'think' ? 1 : 0, .5);
      return;
    }
    last = performance.now();
    raf = requestAnimationFrame(frameLoop);
  }
  reduce.addEventListener('change', start);
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else start(); });
  new MutationObserver(() => { if (reduce.matches) start(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- Контролы ----------
  document.querySelectorAll('.chips').forEach(group => {
    group.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      group.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      const key = group.dataset.key;
      state[key] = key === 'palette' ? Number(b.dataset.v) : b.dataset.v;
      if (key === 'mode') {
        if (state.mode === 'auto') setPhase('listen');
        else if (state.mode === 'listen') { setPhase('listen'); renderWords(words, words.length); statusEl.textContent = 'Слушаю'; }
        else if (state.mode === 'think') { statusEl.textContent = 'Думаю'; renderWords(words, words.length); }
        else { statusEl.textContent = ''; tr.innerHTML = '<span class="w on muted">Скажите что-нибудь</span>'; }
      }
      start();
    });
  });
  const sens = document.getElementById('sens'), reach = document.getElementById('reach');
  sens.addEventListener('input', () => { state.sens = +sens.value; document.getElementById('sens-o').textContent = (+sens.value).toFixed(1) + '×'; if (reduce.matches) start(); });
  reach.addEventListener('input', () => { state.reach = +reach.value; document.getElementById('reach-o').textContent = (+reach.value).toFixed(2).replace(/0$/, '') + '×'; if (reduce.matches) start(); });

  if (!gl) { statusEl.textContent = 'WebGL недоступен'; }
  start();
})();
</script>
